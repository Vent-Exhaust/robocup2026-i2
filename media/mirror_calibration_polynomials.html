
<div style="position:relative;width:100%;height:420px;">
  <canvas id="mirrorChart"></canvas>
</div>
<div style="display:flex;gap:20px;margin-top:8px;font-size:12px;color:var(--color-text-secondary);">
  <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#378ADD;"></span>X-axis fit</span>
  <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:3px;background:#378ADD;"></span>X data points</span>
  <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75;"></span>Y-axis fit</span>
  <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:3px;background:#1D9E75;"></span>Y data points</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const POLY_X = [1.94466527e-4, -7.59780478e-2, 1.01680149e1, -4.36382611e2];
const POLY_Y = [2.56781054e-4, -9.28917129e-2, 1.14339158e1, -4.46999817e2];

function poly(c, r) {
  return c[0]*r*r*r + c[1]*r*r + c[2]*r + c[3];
}

const xPoints = [
  {r:105,d:19},{r:136,d:29},{r:155,d:39},{r:166,d:49},{r:175,d:59},
  {r:182,d:69},{r:187,d:79},{r:191,d:89},{r:195,d:99},{r:198,d:109},
  {r:203,d:119},{r:205,d:129},{r:206,d:139}
];
const yPoints = [
  {r:92,d:19},{r:119,d:29},{r:138,d:39},{r:153,d:49},
  {r:163,d:59},{r:169,d:69},{r:173,d:79},{r:175,d:89}
];

const rMin = 88, rMax = 210;
const curveR = [];
for (let r = rMin; r <= rMax; r += 1) curveR.push(r);

const curveX = curveR.map(r => ({ x: r, y: Math.round(poly(POLY_X, r) * 10) / 10 }));
const curveY = curveR.map(r => ({ x: r, y: Math.round(poly(POLY_Y, r) * 10) / 10 }));

new Chart(document.getElementById('mirrorChart'), {
  type: 'scatter',
  data: {
    datasets: [
      {
        label: 'X-axis fit',
        data: curveX,
        type: 'line',
        borderColor: '#378ADD',
        backgroundColor: 'transparent',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.4,
        order: 2,
      },
      {
        label: 'X data',
        data: xPoints.map(p => ({ x: p.r, y: p.d })),
        backgroundColor: '#378ADD',
        borderColor: '#185FA5',
        borderWidth: 1,
        pointRadius: 5,
        pointHoverRadius: 7,
        order: 1,
      },
      {
        label: 'Y-axis fit',
        data: curveY,
        type: 'line',
        borderColor: '#1D9E75',
        backgroundColor: 'transparent',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.4,
        order: 2,
      },
      {
        label: 'Y data',
        data: yPoints.map(p => ({ x: p.r, y: p.d })),
        backgroundColor: '#1D9E75',
        borderColor: '#0F6E56',
        borderWidth: 1,
        pointRadius: 5,
        pointHoverRadius: 7,
        order: 1,
      },
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => `r=${ctx.parsed.x}px → ${ctx.parsed.y.toFixed(1)}cm`
        }
      }
    },
    scales: {
      x: {
        type: 'linear',
        title: { display: true, text: 'r (pixels from image centre)', color: '#888780' },
        min: 85,
        max: 215,
        ticks: { color: '#888780', stepSize: 20 },
        grid: { color: 'rgba(136,135,128,0.15)' }
      },
      y: {
        title: { display: true, text: 'real distance (cm)', color: '#888780' },
        min: 0,
        max: 150,
        ticks: { color: '#888780', stepSize: 20 },
        grid: { color: 'rgba(136,135,128,0.15)' }
      }
    }
  }
});
</script>
